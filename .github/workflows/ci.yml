name: CI

# Every pull request into master builds the workspace, runs the tests and packages the CLI
# the way the release workflow does, so a merge never reaches Release broken. A second job
# runs the shared relay checks against both relay implementations.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check ssmver.toml matches the CLI version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' ssmver.toml)
          cli=$(node -p "require('./packages/cli/package.json').version")
          if [ -z "$version" ] || [ "$version" != "$cli" ]; then
            echo "::error::ssmver.toml is at '$version' but packages/cli/package.json is at '$cli'"
            exit 1
          fi
      - name: Check every PR source commit bumps its version
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-versions.mjs "$BASE_SHA" "$SOURCE_HEAD_SHA"
      - name: Test version policy
        run: node --test scripts/check-commit-versions.test.mjs
      - run: npm ci
      - run: npm test
      - name: Check feature documentation coverage
        run: npm run docs:check
      - name: Test documentation synchronization
        run: node --test scripts/docs-sync.test.mjs
      - name: Package the CLI
        run: node scripts/build-distribution.mjs artifacts

  # The same relay checks against the Node relay and the Durable Object relay
  # Build durable-runtime master with this PR's packages so changes that either
  # adapter cannot follow fail here. Coordinated adapter changes may temporarily
  # pin a companion commit, but restore master after that adapter change merges.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: PairLobby/durable-runtime
          ref: master
          path: .parity/durable-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/parity-dependencies.test.mjs scripts/check-candidates.test.mjs
      - run: node scripts/durable-parity.mjs .parity/durable-runtime --install --parity .parity/parity.md
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Parity table
        if: always()
        run: |
          if [ -f .parity/parity.md ]; then
            { echo '## Relay parity'; echo; cat .parity/parity.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
